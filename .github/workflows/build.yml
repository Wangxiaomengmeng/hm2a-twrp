name: Build PhilZ Touch lte26007

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: src

      - name: Free disk space (manual)
        run: |
          echo "Before:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "After:"
          df -h

      - name: Setup JDK 7 (Android 4.4 era)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '7'

      - name: Install Python 2.7 and 32-bit system libpcre
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y python2.7 libpcre3-dev libpcre3-dev:i386
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            schedtool libncurses5 libtinfo5

      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          git config --global user.name  "gha"
          git config --global user.email "gha@example.com"

      - name: Cache repo sync
        uses: actions/cache@v4
        with:
          path: ~/cm11/.repo
          key: cm-11.0-philz-repo-${{ hashFiles('src/device/leadcore/lte26007/BoardConfig.mk') }}

      - name: Repo init
        run: |
          mkdir -p ~/cm11 && cd ~/cm11
          repo init --depth=1 -u https://github.com/CyanogenMod/android.git -b cm-11.0

      - name: Add PhilZ Touch to local_manifests (BEFORE sync)
        run: |
          cd ~/cm11
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/philz.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remote name="philz" fetch="https://github.com/" />
            <remove-project name="CyanogenMod/android_bootable_recovery" />
            <project path="bootable/recovery" name="PhilZ-cwm6/philz_touch_cwm6" remote="philz" revision="cm-11.0" />
          </manifest>
          EOF
          cat .repo/local_manifests/philz.xml

      - name: Repo sync (with local_manifest already in place)
        run: |
          cd ~/cm11
          repo sync -c --no-clone-bundle --no-tags --force-sync -j$(nproc)

      - name: Drop in device tree and kernel
        run: |
          cd ~/cm11
          mkdir -p device/leadcore/lte26007
          cp -r $GITHUB_WORKSPACE/src/device/leadcore/lte26007/* device/leadcore/lte26007/

      - name: Patch checkpolicy for modern GCC
        run: |
          cd ~/cm11
          if grep -q "LOCAL_CFLAGS" external/checkpolicy/Android.mk; then
            sed -i 's/^LOCAL_CFLAGS +=/LOCAL_CFLAGS += -fcommon/' external/checkpolicy/Android.mk
            sed -i 's/^LOCAL_CFLAGS :=/LOCAL_CFLAGS := -fcommon/' external/checkpolicy/Android.mk
          else
            sed -i '/^LOCAL_MODULE/a LOCAL_CFLAGS := -fcommon' external/checkpolicy/Android.mk
          fi

      - name: Patch libselinux pcre linking
        run: |
          cd ~/cm11
          FILE=external/libselinux/Android.mk
          HOST_BUILD_LINE=$(grep -n "BUILD_HOST_STATIC_LIBRARY" $FILE | head -1 | cut -d: -f1)
          if [ -n "$HOST_BUILD_LINE" ]; then
            HOST_START=$(head -n $HOST_BUILD_LINE $FILE | grep -n "include \$(CLEAR_VARS)" | tail -1 | cut -d: -f1)
            sed -i "${HOST_START},${HOST_BUILD_LINE}s/LOCAL_WHOLE_STATIC_LIBRARIES \(:=\|+=\) libpcre/LOCAL_STATIC_LIBRARIES \1 libpcre/" $FILE
          fi
          for f in $(grep -rl "BUILD_HOST_EXECUTABLE" --include=Android.mk . | grep -v "^./out"); do
            if grep -q "libselinux" "$f" && ! grep -q "LOCAL_LDLIBS.*lpcre" "$f"; then
              sed -i '/include \$(BUILD_HOST_EXECUTABLE)/i LOCAL_LDLIBS += -lpcre' "$f"
            fi
          done

      - name: Build recovery
        run: |
          cd ~/cm11
          source build/envsetup.sh
          lunch cm_lte26007-eng
          mka -j$(nproc) recoveryimage RECOVERY_VARIANT=philz 2>&1 | tee build.log || true
          ls -la out/target/product/lte26007/recovery/root/ || true

      - name: Repack ramdisk_recovery (gzip cpio)
        if: always()
        run: |
          cd ~/cm11/out/target/product/lte26007/recovery/root 2>/dev/null || exit 0
          find . | cpio -o -H newc | gzip -9 > $GITHUB_WORKSPACE/ramdisk_recovery.img
          ls -l $GITHUB_WORKSPACE/ramdisk_recovery.img
          echo "size = $(stat -c%s $GITHUB_WORKSPACE/ramdisk_recovery.img) bytes"

      - name: Upload ramdisk + build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: philz-lte26007
          path: |
            ramdisk_recovery.img
            /home/runner/cm11/out/target/product/lte26007/recovery.img
            /home/runner/cm11/out/target/product/lte26007/ramdisk-recovery.img
            /home/runner/cm11/build.log