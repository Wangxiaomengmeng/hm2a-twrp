name: Build TWRP lte26007 (4.4)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: src

      - name: Free disk space (manual)
        run: |
          echo "Before:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "After:"
          df -h

      - name: Setup JDK 7 (Android 4.4 era)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '7'

      - name: Install Python 2.7 and 32-bit system libpcre
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y python2.7 libpcre3-dev libpcre3-dev:i386
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            schedtool libncurses5 libtinfo5

      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          git config --global user.name  "gha"
          git config --global user.email "gha@example.com"

      - name: Cache repo sync
        uses: actions/cache@v4
        with:
          path: ~/twrp/.repo
          key: twrp-4.4-dep-repo-${{ hashFiles('src/device/leadcore/lte26007/BoardConfig.mk') }}

      - name: Init and sync minimal manifest
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-4.4-deprecated
          repo sync -c --no-clone-bundle --no-tags -j$(nproc)

      - name: Fetch missing mksh source
        run: |
          cd ~/twrp
          MIRRORS=(
            "https://github.com/CyanogenMod/android_external_mksh.git"
            "https://android.googlesource.com/platform/external/mksh"
          )
          SUCCESS=0
          for m in "${MIRRORS[@]}"; do
            if git clone --depth=1 "$m" external/mksh 2>/dev/null; then
              SUCCESS=1; echo "Cloned from $m"; break
            fi
            rm -rf external/mksh
          done
          [ "$SUCCESS" = "1" ] || { echo "mksh clone failed"; exit 1; }

      - name: Patch mksh module name
        run: |
          cd ~/twrp
          sed -i 's/^LOCAL_MODULE := sh/LOCAL_MODULE := mksh/' external/mksh/Android.mk
          sed -i 's/^LOCAL_MODULE:=sh/LOCAL_MODULE := mksh/' external/mksh/Android.mk

      - name: Drop in device tree and kernel
        run: |
          cd ~/twrp
          mkdir -p device/leadcore/lte26007
          cp -r $GITHUB_WORKSPACE/src/device/leadcore/lte26007/* device/leadcore/lte26007/

      - name: Patch AOSP 4.4 JDK checks
        run: |
          cd ~/twrp
          sed -i 's/\$(error stop)/\$(info JDK check bypassed)/g' build/core/main.mk

      - name: Patch checkpolicy for modern GCC
        run: |
          cd ~/twrp
          if grep -q "LOCAL_CFLAGS" external/checkpolicy/Android.mk; then
            sed -i 's/^LOCAL_CFLAGS +=/LOCAL_CFLAGS += -fcommon/' external/checkpolicy/Android.mk
            sed -i 's/^LOCAL_CFLAGS :=/LOCAL_CFLAGS := -fcommon/' external/checkpolicy/Android.mk
          else
            sed -i '/^LOCAL_MODULE/a LOCAL_CFLAGS := -fcommon' external/checkpolicy/Android.mk
          fi

      - name: Patch libselinux pcre linking
        run: |
          cd ~/twrp
          FILE=external/libselinux/Android.mk
          HOST_BUILD_LINE=$(grep -n "BUILD_HOST_STATIC_LIBRARY" $FILE | head -1 | cut -d: -f1)
          if [ -n "$HOST_BUILD_LINE" ]; then
            HOST_START=$(head -n $HOST_BUILD_LINE $FILE | grep -n "include \$(CLEAR_VARS)" | tail -1 | cut -d: -f1)
            sed -i "${HOST_START},${HOST_BUILD_LINE}s/LOCAL_WHOLE_STATIC_LIBRARIES \(:=\|+=\) libpcre/LOCAL_STATIC_LIBRARIES \1 libpcre/" $FILE
          fi
          for f in $(grep -rl "BUILD_HOST_EXECUTABLE" --include=Android.mk . | grep -v "^./out"); do
            if grep -q "libselinux" "$f" && ! grep -q "LOCAL_LDLIBS.*lpcre" "$f"; then
              sed -i '/include \$(BUILD_HOST_EXECUTABLE)/i LOCAL_LDLIBS += -lpcre' "$f"
            fi
          done

      - name: Patch host clang warnings and std::data
        run: |
          cd ~/twrp

          # 1) 关闭 GCC 11 的 class-memaccess 错误
          for f in $(find external/clang external/llvm -name "Android.mk"); do
            if ! grep -q "class-memaccess" "$f"; then
              sed -i 's/^LOCAL_CFLAGS :=/LOCAL_CFLAGS := -Wno-error=class-memaccess -Wno-class-memaccess/' "$f"
              sed -i 's/^LOCAL_CFLAGS +=/LOCAL_CFLAGS += -Wno-error=class-memaccess -Wno-class-memaccess/' "$f"
              sed -i 's/^LOCAL_CXXFLAGS :=/LOCAL_CXXFLAGS := -Wno-error=class-memaccess -Wno-class-memaccess/' "$f"
              sed -i 's/^LOCAL_CXXFLAGS +=/LOCAL_CXXFLAGS += -Wno-error=class-memaccess -Wno-class-memaccess/' "$f"
              if ! grep -q "class-memaccess" "$f"; then
                sed -i '/^LOCAL_MODULE/a LOCAL_CFLAGS += -Wno-error=class-memaccess -Wno-class-memaccess' "$f"
              fi
            fi
          done
          for f in build/core/combo/HOST_linux-x86.mk build/core/combo/HOST_linux-x86_64.mk; do
            if [ -f "$f" ]; then
              echo "HOST_GLOBAL_CFLAGS += -Wno-error=class-memaccess -Wno-class-memaccess" >> "$f"
              echo "HOST_GLOBAL_CPPFLAGS += -Wno-error=class-memaccess -Wno-class-memaccess" >> "$f"
            fi
          done

          # 2) 修 std::data 与成员函数 data() 的 ADL 冲突
          #    把 data(Foo) 改成 Foo.data()，只匹配简单标识符参数
          F=external/clang/lib/Serialization/ASTWriter.cpp
          echo "=== Before ==="
          grep -n "[^.]data(" $F | head -20 || true
          sed -i -E 's/([^.:a-zA-Z_])data\(([A-Za-z_][A-Za-z0-9_]*)\)/\1\2.data()/g' $F
          echo "=== After ==="
          grep -n "data(" $F | head -20 || true

      - name: Build recovery
        run: |
          cd ~/twrp
          source build/envsetup.sh
          lunch omni_lte26007-eng
          mka recoveryimage -j$(nproc) 2>&1 | tee build.log || true
          ls -la out/target/product/lte26007/recovery/root/ || true

      - name: Repack ramdisk_recovery (gzip cpio)
        if: always()
        run: |
          cd ~/twrp/out/target/product/lte26007/recovery/root
          find . | cpio -o -H newc | gzip -9 > $GITHUB_WORKSPACE/ramdisk_recovery.img
          ls -l $GITHUB_WORKSPACE/ramdisk_recovery.img
          echo "size = $(stat -c%s $GITHUB_WORKSPACE/ramdisk_recovery.img) bytes"

      - name: Upload ramdisk + recovery.img + build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-lte26007-44
          path: |
            ramdisk_recovery.img
            /home/runner/twrp/out/target/product/lte26007/recovery.img
            /home/runner/twrp/out/target/product/lte26007/ramdisk-recovery.img
            /home/runner/twrp/build.log