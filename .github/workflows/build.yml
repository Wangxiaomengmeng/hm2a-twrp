name: Build TWRP lte26007

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          path: src

      - name: Free disk space (manual)
        run: |
          echo "Before:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "After:"
          df -h

      - name: Setup JDK 8
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Install Python 2.7
        run: |
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python2.7
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
            libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            schedtool libncurses5 libtinfo5

      - name: Setup repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo
          git config --global user.name  "gha"
          git config --global user.email "gha@example.com"

      - name: Cache repo sync
        uses: actions/cache@v4
        with:
          path: ~/twrp/.repo
          key: twrp-5.1-repo-${{ hashFiles('src/device/leadcore/lte26007/BoardConfig.mk') }}

      - name: Init and sync minimal manifest
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-5.1
          repo sync -c --no-clone-bundle --no-tags -j$(nproc)

      - name: Drop in device tree and kernel
        run: |
          cd ~/twrp
          mkdir -p device/leadcore/lte26007
          cp -r $GITHUB_WORKSPACE/src/device/leadcore/lte26007/* device/leadcore/lte26007/

      - name: Fix libselinux pcre linking (only host block)
        run: |
          cd ~/twrp
          FILE=external/libselinux/Android.mk
          echo "===== Original ====="
          cat $FILE

          # 只修改 HOST 块里的 WHOLE -> static，target 块保留 WHOLE
          HOST_BUILD_LINE=$(grep -n "BUILD_HOST_STATIC_LIBRARY" $FILE | head -1 | cut -d: -f1)
          if [ -n "$HOST_BUILD_LINE" ]; then
            HOST_START=$(head -n $HOST_BUILD_LINE $FILE | grep -n "include \$(CLEAR_VARS)" | tail -1 | cut -d: -f1)
            echo "Host block: lines $HOST_START to $HOST_BUILD_LINE"
            sed -i "${HOST_START},${HOST_BUILD_LINE}s/LOCAL_WHOLE_STATIC_LIBRARIES \(:=\|+=\) libpcre/LOCAL_STATIC_LIBRARIES \1 libpcre/" $FILE
          fi

          # host 工具补 libpcre
          for f in $(find external/libselinux -name Android.mk); do
            if grep -q "BUILD_HOST_EXECUTABLE" "$f"; then
              if ! grep -q "^LOCAL_STATIC_LIBRARIES.*libpcre" "$f"; then
                echo "Patching host tool: $f"
                sed -i '/include \$(BUILD_HOST_EXECUTABLE)/i LOCAL_STATIC_LIBRARIES += libpcre' "$f"
              fi
            fi
          done

          echo "===== After ====="
          cat $FILE

      - name: Patch checkpolicy for modern GCC
        run: |
          cd ~/twrp
          if grep -q "LOCAL_CFLAGS" external/checkpolicy/Android.mk; then
            sed -i 's/^LOCAL_CFLAGS +=/LOCAL_CFLAGS += -fcommon/' external/checkpolicy/Android.mk
            sed -i 's/^LOCAL_CFLAGS :=/LOCAL_CFLAGS := -fcommon/' external/checkpolicy/Android.mk
          else
            sed -i '/^LOCAL_MODULE/a LOCAL_CFLAGS := -fcommon' external/checkpolicy/Android.mk
          fi
          echo "===== checkpolicy Android.mk ====="
          cat external/checkpolicy/Android.mk

      - name: Build recovery
        run: |
          cd ~/twrp
          source build/envsetup.sh
          lunch omni_lte26007-eng
          mka recoveryimage -j$(nproc) 2>&1 | tee build.log || true
          ls -la out/target/product/lte26007/recovery/root/ || true

      - name: Repack ramdisk_recovery (gzip cpio)
        if: always()
        run: |
          cd ~/twrp/out/target/product/lte26007/recovery/root
          find . | cpio -o -H newc | gzip -9 > $GITHUB_WORKSPACE/ramdisk_recovery.img
          ls -l $GITHUB_WORKSPACE/ramdisk_recovery.img
          echo "size = $(stat -c%s $GITHUB_WORKSPACE/ramdisk_recovery.img) bytes"

      - name: Upload ramdisk + build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-lte26007
          path: |
            ramdisk_recovery.img
            /home/runner/twrp/out/target/product/lte26007/recovery.img
            /home/runner/twrp/build.log